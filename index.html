</style></head><body><div class="shell"><aside class="sidebar"><div class="logo">YURI <small>GRADPATH · 2027</small></div><nav class="nav" id="nav"><button data-page="dashboard" class="active">◫　总览</button><button data-page="schools">▤　学校申请</button><button data-page="faculty">♧　教授套磁</button><button data-page="tasks">☑　任务与截止日</button><button data-page="funding">◇　奖学金与资助</button><button data-page="materials">▣　申请材料</button><button data-page="settings">⚙　数据备份</button></nav><div class="sidefoot">Thesis-based M.S. · Food Science<br>Fall 2027 · 独立申请工作台<br>你的数据默认只存储在当前浏览器。</div></aside><main class="main"><header class="top"><div><div class="eyebrow">2027 FALL · FOOD SCIENCE</div><h1 id="pageTitle">申请总览</h1><p class="subtitle" id="pageSub">把每所学校、每位教授和每一个申请动作放在同一个地方。</p></div><div class="actions" id="pageActions"></div></header><div id="content"></div></main></div><div class="modal" id="modal" aria-hidden="true"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">添加记录</h2><button class="btn" onclick="closeModal()">关闭 ×</button></div><form id="recordForm"><div class="formgrid" id="formFields"></div><div class="actions" style="justify-content:flex-end;margin-top:23px"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary" type="submit">保存记录</button></div></form></div></div><script>
const KEY='yuri_gradpath_2027_v1';const schoolNames=['Cornell University','Ohio State University','University of Wisconsin–Madison','Washington State University','University of Illinois Urbana-Champaign','North Carolina State University','University of Florida','University of Georgia','Pennsylvania State University','Purdue University','Kansas State University','Iowa State University','Rutgers University','University of Massachusetts Amherst','University of California, Davis','Oregon State University','Michigan State University','University of Minnesota','Auburn University','Virginia Tech','Clemson University','Texas A&M University','University of Wisconsin–Stout'];
const seed=()=>({schools:schoolNames.map((name,i)=>({id:'s'+i,name,program:'Food Science / 待核实具体项目',type:'待核实（Thesis MS）',status:'研究中',deadline:'',priority:'待评估',notes:'仅为候选学校。官方项目、经费、DDL 尚未核实。',url:''})),faculty:[],tasks:[{id:'t1',title:'核实各校是否提供 thesis-based M.S. 及资助机制',school:'',due:'',status:'待办',priority:'高',notes:'优先官网项目与 Graduate Handbook'},{id:'t2',title:'确认导师研究方向、近年论文和是否招 funded MS',school:'',due:'',status:'待办',priority:'高',notes:'事实与个人判断分开记录'}],funding:[{id:'f1',name:'WAFP（历史获奖记录）',school:'不限',amount:'$3,000（2025 已获）',deadline:'',status:'历史记录',notes:'不是 2027 可用奖学金；仅作为 CV 荣誉素材。'},{id:'f2',name:'MN-IFT（历史获奖/荣誉记录）',school:'不限',amount:'待核实',deadline:'',status:'历史记录',notes:'请补充准确类别、金额和年份。'}],materials:[{id:'m1',name:'CV（英文，一页）',status:'已完成',notes:'含 HACCP / CITI / PCQI、Dean’s List、WAFP 等'},{id:'m2',name:'SOP 基础版',status:'已完成',notes:'每校需根据导师和研究方向定制'},{id:'m3',name:'推荐信 — Dr. Taejo Kim',status:'已确认支持',notes:''},{id:'m4',name:'推荐信 — Dr. Lee',status:'已确认支持',notes:''},{id:'m5',name:'第三推荐人',status:'待确认',notes:'Mitra / 其他候选'},{id:'m6',name:'成绩单',status:'待处理',notes:'学校要求需逐项核实'},{id:'m7',name:'语言成绩 IELTS',status:'待核实',notes:'已有 IELTS 6.5；需核对各校有效期与最低要求'}]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch{data=seed()}let page='dashboard',filter='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const statuses=['研究中','准备申请','已套磁','申请中','已提交','录取','拒绝','暂停'];const h=(label,kind='')=>`<span class="tag ${kind}">${esc(label)}</span>`;const be=(s)=>s==='已完成'||s==='录取'||s==='已提交'||s==='已确认支持'?'good':s==='拒绝'||s==='暂停'?'bad':s==='待办'||s==='待核实'?'warn':'';
const config={schools:{title:'学校申请',sub:'23 所初始候选学校，不等于最终申请名单；学校和项目信息需要逐一官网核实。',singular:'学校',fields:[['name','学校名称','text',true],['program','专业 / 项目','text'],['type','项目类型 / 经费核验','text'],['status','申请状态','select',false,statuses],['priority','优先级','select',false,['待评估','冲刺','主申','保底','不申请']],['deadline','官方申请截止日期','date'],['url','官方链接','url'],['notes','核查记录 / 备注','textarea']]},faculty:{title:'教授套磁',sub:'把导师、研究匹配度、邮件日期和回复情况记录下来。',singular:'教授',fields:[['name','教授姓名','text',true],['school','学校','text'],['research','研究方向与匹配原因','textarea'],['status','邮件状态','select',false,['待调查','准备邮件','已发送','已回复','积极反馈','不招生','未回复']],['sent','首次联系日期','date'],['followup','跟进日期','date'],['email','邮箱','email'],['url','教授官网 / 论文链接','url'],['notes','经费证据 / 招生证据 / 备注','textarea']]},tasks:{title:'任务与截止日',sub:'记录真正要执行的动作，避免导师邮件和申请截止日遗漏。',singular:'任务',fields:[['title','任务名称','text',true],['school','关联学校','text'],['due','截止日期','date'],['status','状态','select',false,['待办','进行中','已完成','暂停']],['priority','优先级','select',false,['高','中','低']],['notes','备注','textarea']]},funding:{title:'奖学金与资助',sub:'分清已获得的历史荣誉与 2027 申请期间可申请的资金。',singular:'资助',fields:[['name','奖学金 / RA / TA 名称','text',true],['school','学校 / 机构','text'],['amount','金额 / 资助方式','text'],['deadline','截止日期','date'],['status','状态','select',false,['待核实','符合条件','准备申请','已申请','获得','未获得','历史记录']],['url','官方申请链接','url'],['notes','国籍 / 在读要求 / 资格备注','textarea']]},materials:{title:'申请材料',sub:'CV、SOP、推荐信、成绩单、语言成绩；支持逐项更改进度。',singular:'材料',fields:[['name','材料名称','text',true],['status','准备情况','select',false,['待处理','进行中','已完成','待确认','已确认支持','待核实']],['notes','材料说明','textarea']]}};
function navigate(p){page=p;filter='';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
function render(){const cfg=config[page];document.getElementById('pageTitle').textContent=cfg?.title||({dashboard:'申请总览',settings:'数据备份'}[page]);document.getElementById('pageSub').textContent=cfg?.sub||({dashboard:'研究型硕士优先 · 项目官网核实优先 · 记录每个关键决定。',settings:'数据保存在本设备的当前浏览器。定期导出 JSON 备份。'}[page]);document.getElementById('pageActions').innerHTML=cfg?`<button class="btn primary" onclick="openModal('${page}')">＋ 添加${cfg.singular}</button>`:`<button class="btn" onclick="exportJSON()">↓ 导出备份</button>`;document.getElementById('content').innerHTML=page==='dashboard'?dashboard():page==='settings'?settings():listing(page)}
function dashboard(){const submitted=data.schools.filter(s=>s.status==='已提交').length,active=data.schools.filter(s=>!['暂停','拒绝'].includes(s.status)).length,answered=data.faculty.filter(f=>['已回复','积极反馈'].includes(f.status)).length,done=data.tasks.filter(t=>t.status==='已完成').length;const upcoming=data.tasks.filter(t=>t.due&&t.status!=='已完成').sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6);const statusesDone=data.materials.filter(m=>['已完成','已确认支持'].includes(m.status)).length;return `<div class="grid"><div class="metric"><div class="label">候选学校</div><div class="num">${data.schools.length}</div><div class="hint">${active} 所仍在关注</div></div><div class="metric"><div class="label">已提交申请</div><div class="num">${submitted}</div><div class="hint">以手动登记为准</div></div><div class="metric"><div class="label">导师回复</div><div class="num">${answered}</div><div class="hint">总共 ${data.faculty.length} 位导师档案</div></div><div class="metric"><div class="label">已完成任务</div><div class="num">${done}/${data.tasks.length}</div><div class="hint">持续更新</div></div></div><div class="cols"><div><section class="panel"><h2>下一步 · 优先事项</h2>${data.tasks.filter(t=>t.status!=='已完成').slice(0,6).map(t=>`<div class="listrow"><div><b>${esc(t.title)}</b><div class="small">${esc(t.school||'通用任务')} · ${esc(t.due||'尚未设置截止日')}</div></div>${h(t.priority||'待办',t.priority==='高'?'warn':'')}</div>`).join('')||'<div class="empty">暂无待办事项</div>'}<button class="btn" style="margin-top:15px" onclick="navigate('tasks')">查看所有任务</button></section><section class="panel"><h2>最近截止日</h2>${upcoming.map(t=>`<div class="listrow"><div>${esc(t.title)}<div class="small">${esc(t.school||'通用')}</div></div><b>${esc(t.due)}</b></div>`).join('')||'<div class="empty">尚无已核实并录入的截止日，请到「学校申请」和「任务」添加。</div>'}</section></div><div><section class="panel"><h2>材料准备进度</h2><div style="font-size:26px;font-weight:800">${statusesDone} <span class="small">/ ${data.materials.length} 项</span></div><div class="progress"><span style="width:${data.materials.length?100*statusesDone/data.materials.length:0}%"></span></div>${data.materials.map(m=>`<div class="listrow"><span>${esc(m.name)}</span>${h(m.status,be(m.status))}</div>`).join('')}<button class="btn" style="margin-top:15px" onclick="navigate('materials')">管理材料</button></section><div class="note"><b>申请策略提醒</b><br>优先区分 <b>Thesis M.S.</b>、<b>是否有 RA/TA</b> 和 <b>导师是否招生</b>。学校是否在名单中，不代表它一定提供 funded MS。所有空白截止日期表示「未知」，不代表无需申请。</div></div></div>`}
function listing(kind){const rows=data[kind].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(filter.toLowerCase())));let columns={schools:[['name','学校'],['program','专业'],['status','状态'],['priority','定位'],['deadline','截止日期']],faculty:[['name','教授'],['school','学校'],['status','套磁状态'],['sent','联系日期'],['followup','跟进日期']],tasks:[['title','任务'],['school','关联学校'],['due','截止日期'],['priority','优先级'],['status','状态']],funding:[['name','资金来源'],['school','机构'],['amount','金额'],['deadline','截止日期'],['status','状态']],materials:[['name','材料'],['status','状态'],['notes','备注']]}[kind];return `<div class="toolbar"><input class="field search" value="${esc(filter)}" oninput="filter=this.value;updateTable('${kind}')" placeholder="搜索学校、教授或备注..."/><button class="btn" onclick="exportCSV('${kind}')">↓ 导出 CSV</button></div><div class="panel"><div class="small" style="margin-bottom:12px">共 <b id="count">${rows.length}</b> 条记录。点击名称可编辑。</div><div class="tablewrap"><table class="table"><thead><tr>${columns.map(c=>`<th>${c[1]}</th>`).join('')}<th>操作</th></tr></thead><tbody id="tablebody">${tableRows(kind,rows,columns)}</tbody></table></div></div>${kind==='schools'?'<div class="note">初始 23 所学校来自你的候选名单；不是经官网核验后的最终选校名单。Ohio State、WSU 和 Oregon State 均已包含。项目名称、奖学金资格及申请日期未进行实时核验，请自行核实并记录官方链接。</div>':''}`}
function tableRows(kind,rows,columns){return rows.map(x=>`<tr>${columns.map((c,i)=>`<td>${i===0?`<button class="click" onclick="openModal('${kind}','${x.id}')">${esc(x[c[0]]||'未填写')}</button>`:(['status','priority'].includes(c[0])?h(x[c[0]]||'未设置',be(x[c[0]])):esc(x[c[0]]||'—'))}</td>`).join('')}<td><button class="click" onclick="openModal('${kind}','${x.id}')">编辑</button></td></tr>`).join('')||`<tr><td colspan="${columns.length+1}" class="empty">没有符合条件的记录</td></tr>`}function updateTable(kind){document.getElementById('tablebody').innerHTML=tableRows(kind,data[kind].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(filter.toLowerCase()))),{schools:[['name'],['program'],['status'],['priority'],['deadline']],faculty:[['name'],['school'],['status'],['sent'],['followup']],tasks:[['title'],['school'],['due'],['priority'],['status']],funding:[['name'],['school'],['amount'],['deadline'],['status']],materials:[['name'],['status'],['notes']]}[kind]);document.getElementById('count').textContent=data[kind].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(filter.toLowerCase()))).length}
let editing={};function openModal(kind,id){editing={kind,id};const record=data[kind].find(x=>x.id===id)||{};document.getElementById('modalTitle').textContent=(id?'编辑':'添加')+config[kind].singular;document.getElementById('formFields').innerHTML=config[kind].fields.map(([key,label,type,required,options])=>`<label class="${type==='textarea'?'wide':''}">${label}${required?' *':''}${type==='textarea'?`<textarea class="field" name="${key}">${esc(record[key]||'')}</textarea>`:type==='select'?`<select class="field" name="${key}">${(options||[]).map(o=>`<option value="${esc(o)}" ${o===(record[key]||'')?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="field" name="${key}" type="${type}" value="${esc(record[key]||'')}" ${required?'required':''}>`}</label>`).join('')+(id?`<div class="wide"><button type="button" class="btn danger" onclick="removeRecord()">删除这条记录</button></div>`:'');document.getElementById('modal').classList.add('open');document.getElementById('modal').setAttribute('aria-hidden','false')}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('modal').setAttribute('aria-hidden','true')}document.getElementById('recordForm').addEventListener('submit',e=>{e.preventDefault();const obj={id:editing.id||uid()};for(const [k,v] of new FormData(e.target))obj[k]=v.trim();if(editing.id){const i=data[editing.kind].findIndex(x=>x.id===editing.id);if(i>=0)data[editing.kind][i]=obj}else data[editing.kind].push(obj);save();closeModal();render()});function removeRecord(){if(!confirm('确认删除这条记录？'))return;data[editing.kind]=data[editing.kind].filter(x=>x.id!==editing.id);save();closeModal();render()}
function download(text,name,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportJSON(){download(JSON.stringify(data,null,2),'YURI_GradPath_2027_backup.json','application/json')}function exportCSV(kind){const keys=config[kind].fields.map(x=>x[0]);const quoted=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('\ufeff'+[keys.join(','),...data[kind].map(x=>keys.map(k=>quoted(x[k])).join(','))].join('\r\n'),`YURI_${kind}_2027.csv`,'text/csv;charset=utf-8')}
function settings(){return `<section class="panel"><h2>备份与迁移</h2><p class="small">所有修改自动保存在当前浏览器的 localStorage 中。清除浏览器数据、更换设备或使用无痕模式可能丢失记录，因此请定期导出。</p><div class="actions" style="margin:21px 0"><button class="btn primary" onclick="exportJSON()">↓ 下载完整 JSON 备份</button><label class="btn">↑ 导入 JSON 备份<input id="importfile" type="file" accept="application/json,.json" style="display:none" onchange="importJSON(event)"></label></div><div class="note">CSV 可在各模块单独导出用于 Excel / Numbers；JSON 可重新导入本软件，恢复所有记录。导入会覆盖当前记录，请先导出备份。</div></section><section class="panel"><h2>初始化与清空</h2><p class="small">恢复最初的候选学校和材料清单，删除自己添加的所有修改。</p><button class="btn danger" onclick="resetAll()">重置所有数据</button></section><div class="foot">GradPath 原型 v1.0 · 本地单文件应用 · 不自动访问学校官网、不自动发送导师邮件、不上传任何信息到服务器。</div>`}function importJSON(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!['schools','faculty','tasks','funding','materials'].every(k=>Array.isArray(d[k])))throw Error('格式不正确');if(!confirm('导入将覆盖当前所有记录，确定继续？'))return;data=d;save();render();alert('已成功恢复记录')}catch(err){alert('导入失败：'+err.message)}};reader.readAsText(file)}function resetAll(){if(confirm('这会删除所有已保存的进度。确定恢复初始数据吗？')){data=seed();save();render()}}render();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script></body></html>
